/**/driver_node:
  ros__parameters:

    # ── 속도 ──────────────────────────────────────────────────────
    # 이 로봇에는 조향이 없다. 관절은 수동이고 6륜이 관벽에 압착되어
    # 횡방향은 기계가 잡는다. 제어 입력은 전진 속도 하나뿐이다.
    v_max_mps: 0.10
    v_slow_frac: 0.35          # 저속 지시 시 비율
    v_return_mps: 0.12
    accel_mps2: 0.08           # 가속은 완만하게
    decel_mps2: 0.40           # 감속은 빠르게. 정지가 늦으면 안 된다

    # ── 전방 개방도 ───────────────────────────────────────────────
    # 개구부 면적이 작을수록 감속. 정상 직관에서의 면적을 기준으로 잡는다.
    # 실기 정상 주행 데이터로 재조정 대상.
    aperture_ref_px: 90000.0
    aperture_min_frac: 0.25

    # ── 곡관 선제 감속 ────────────────────────────────────────────
    # 개구부가 화면 중앙에서 벗어난 각. 관절 엔코더는 이미 꺾인 뒤에야
    # 반응하지만 이 각은 곡관에 닿기 전에 커진다.
    incidence_slow_deg: 8.0
    incidence_stop_deg: 30.0

    # ── 임무 ──────────────────────────────────────────────────────
    mission_range_m: 30.0

    # ── 끼임 판정 ─────────────────────────────────────────────────
    # 바퀴는 도는데 실제로 안 나가는 것이 끼임이다. 휠 엔코더만으로는
    # 6륜이 동시에 미끄러지는 경우를 못 잡아 시각 오도메트리와 비교한다.
    stuck_wheel_min_mps: 0.02   # 이보다 느리면 판정하지 않는다
    stuck_visual_frac: 0.30     # 시각/휠 비율이 이 아래면 끼임 의심
    stuck_hold_s: 1.5           # 그 상태가 이만큼 지속되어야 확정
    recover_back_m: 0.05
    recover_max_try: 3

    # ── 안전 ──────────────────────────────────────────────────────
    condition_timeout_s: 1.0    # 판정 두절 시 정지
    hold_release_s: 2.0         # 통행 회복 후 재출발까지 대기

    # ── 토픽 ──────────────────────────────────────────────────────
    condition_topic: "condition"
    wheel_topic: "wheel_speed"
    visual_topic: "visual_speed"
    start_topic: "start"
    recall_topic: "recall"
    cmd_topic: "cmd_vel"
    state_topic: "drive_state"
    rate_hz: 20.0
