/**/weld:
  ros__parameters:

    # ── ① 정렬 ────────────────────────────────────────────────────
    # 이 값이 없으면 용접 이벤트만으로 결함이 사라져 성공률이 항상 100%가
    # 된다. 검증이 작동하지 않는다는 뜻이다(설계 7.2).
    # Day 5~6 에 20회 이상 실측 후 결정.
    align_tol_mm: 1.5
    approach_tol_mm: 5.0

    # ── ② Depth 프로파일 ─────────────────────────────────────────
    # 홈이 실제로 메워졌는지 깊이로 확인한다. 검출기 거짓 음성을 잡는 겹.
    bore_r_mm: 50.0
    band_px: 36
    median_px: 3          # 단발 잡음 제거. 크랙 폭(1.6mm)은 살아남아야 한다
    min_deep_px: 6        # 한 점이 아니라 이어진 면적이어야 결함
    depth_defect_mm: 0.6  # 이 이상 파여 있으면 미수리
    depth_repaired_mm: 0.25
    profile_min_px: 60

    # 분위수를 쓰지 말 것. 크랙은 화면에서 몇 화소뿐이라 창 전체의 99분위에
    # 묻혀 사라진다(실측 확인: 2.2mm 파임이 +0.00mm 로 나왔다).

    # ── 시퀀스 ────────────────────────────────────────────────────
    arc_s: 2.0
    cool_base_s: 5.0
    cool_per_mm_s: 0.8    # 결함 크기에 비례한 냉각 대기
    max_retry: 1

    # ── 용접봉 ────────────────────────────────────────────────────
    rod_per_mm3: 1.0
    rod_total_mm: 1880.0  # 코일 수용 한계
